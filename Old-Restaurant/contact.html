<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <title>Cudy Restaurant Website</title>
  </head>
  <body>
    <!--this is a navigational section that's have a logo and the navigation links-->
    <header>
      <div class="logo" id="header-logo">
        <a href="#Home">
          <img src="logo.jpg" alt="this is logo image" />
          <h1>Kudy Restaurant</h1>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html" class="nav-link"> HOME </a></li>
          <li><a href="menu.html" class="nav-link"> MENU </a></li>
          <li><a href="about.html" class="nav-link"> ABOUT US </a></li>
          <li><a href="gallery.html" class="nav-link"> GALLERY </a></li>
          <li><a href="reserve.html" class="nav-link"> RESERVSTION </a></li>
          <li><a href="contact.html" class="nav-link"> CONTACT US </a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1> GET IN TOUCH WITH US</h1>
      <p>
        Have questions about private catering, bookings, or want food delivered to your hotel?
      </p>

      <section reserve-form>
        <div class="container">
          <div class="contact-form-wrapper">
            <form action="" id="contactform" class="contact-form">
              <div class="form-group">
                <label for="name"> Full Name </label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder=" John Doe"
                  required
                />
              </div>
              <div class="form-group">
                <label for="phone-number"> Phone Number </label>
                <input
                  type="tel"
                  id="phone-number"
                  name="phone-number"
                  placeholder="+255 874 106 677"
                  required
                />
              </div>
              <div class="form-group">
                <label for="email"> Email </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="johndoe@example.com "
                  required
                />
              </div>
              <div class="form-group">
                <label for="message"> Special Requests & Diet Notes </label>
                <textarea
                  name="message"
                  id="message"
                  placeholder=" Your Messsage"
                  rows="7"
                  required
                ></textarea>
              </div>
              <div class="form-group">
                <button type="submit">Send Your Message</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
